services:
  backend:
    build:
      context: ./backend
      network: host
    container_name: chatbot-backend
    working_dir: /project/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_DIR=/data/chroma
      - SESSION_DB=/data/sessions.db
      - FLASHRANK_CACHE_DIR=/tmp/flashrank_models
    volumes:
      - .:/project:Z
      - ./data:/data:Z
    command: uvicorn main:app --host 0.0.0.0 --port 8000
